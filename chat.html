<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AmirCalm — گفت‌وگوی آرام</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Vazirmatn',sans-serif;
min-height:100vh;
color:#f5f7ff;

background:
radial-gradient(circle at 15% 15%,rgba(111,145,255,.16),transparent 30%),
radial-gradient(circle at 85% 75%,rgba(161,111,255,.13),transparent 32%),
linear-gradient(145deg,#07101d,#0d1930 50%,#10142a);
}

.background{
position:fixed;
inset:0;
pointer-events:none;
overflow:hidden;
}

.star{
position:absolute;
width:2px;
height:2px;
background:white;
border-radius:50%;
opacity:.45;
animation:twinkle 4s infinite ease-in-out;
}

.star:nth-child(1){top:12%;left:18%}
.star:nth-child(2){top:25%;left:75%;animation-delay:1s}
.star:nth-child(3){top:42%;left:8%;animation-delay:2s}
.star:nth-child(4){top:65%;left:88%;animation-delay:1.5s}
.star:nth-child(5){top:82%;left:25%;animation-delay:.5s}
.star:nth-child(6){top:18%;left:48%;animation-delay:2.5s}
.star:nth-child(7){top:55%;left:58%;animation-delay:3s}

@keyframes twinkle{

0%,100%{
opacity:.2;
transform:scale(1);
}

50%{
opacity:.8;
transform:scale(1.8);
}

}

.home-back{

position:fixed;
bottom:92px;
left:50%;
transform:translateX(-50%);
z-index:50;

display:flex;
align-items:center;
justify-content:center;
gap:8px;

padding:9px 15px;
border-radius:18px;

color:#e8ecff;
text-decoration:none;

font-size:11px;

background:rgba(255,255,255,.055);
border:1px solid rgba(255,255,255,.13);

box-shadow:
0 10px 30px rgba(0,0,0,.25),
inset 0 1px rgba(255,255,255,.08);

backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);

}

.home-back .icon{

width:25px;
height:25px;

display:flex;
align-items:center;
justify-content:center;

border-radius:9px;

background:rgba(255,255,255,.08);

font-size:16px;

}

.app{

position:relative;
z-index:2;

width:100%;
max-width:650px;

height:100vh;

margin:auto;

display:flex;
flex-direction:column;

}

.header{

padding:20px 18px 15px;

display:flex;
align-items:center;

gap:13px;

border-bottom:1px solid rgba(255,255,255,.07);

background:rgba(8,15,30,.45);

backdrop-filter:blur(20px);

}

.moon{

width:48px;
height:48px;

border-radius:17px;

display:flex;
align-items:center;
justify-content:center;

font-size:23px;

background:rgba(255,255,255,.07);

border:1px solid rgba(255,255,255,.1);

}

.header-text{
flex:1;
}

.header-text h1{
font-size:17px;
font-weight:600;
}

.status{

margin-top:3px;

font-size:11px;

color:#91a7d5;

}

.online{

display:inline-block;

width:6px;
height:6px;

border-radius:50%;

background:#8eb5ff;

margin-left:5px;

box-shadow:0 0 10px rgba(142,181,255,.8);

}

.messages{

flex:1;

overflow-y:auto;

padding:28px 17px 120px;

scroll-behavior:smooth;

}

.welcome{

text-align:center;

margin:30px auto 35px;

max-width:430px;

animation:fadeUp .8s ease;

}

.welcome-icon{

font-size:34px;

margin-bottom:17px;

}

.welcome h2{

font-size:24px;

line-height:1.7;

font-weight:600;

margin-bottom:10px;

}

.welcome p{

color:#9eabc4;

font-size:13px;

line-height:2;

}

.message{

display:flex;

margin-bottom:18px;

animation:fadeUp .35s ease;

}

.message.ai{

justify-content:flex-start;

}

.message.user{

justify-content:flex-end;

}

.bubble{

max-width:82%;

padding:13px 16px;

border-radius:20px;

font-size:13px;

line-height:2;

}

.ai .bubble{

background:rgba(255,255,255,.065);

border:1px solid rgba(255,255,255,.09);

border-top-right-radius:6px;

color:#e9edfa;

box-shadow:0 12px 35px rgba(0,0,0,.12);

}

.user .bubble{

background:linear-gradient(135deg,#687fff,#866be3);

border-top-left-radius:6px;

color:white;

box-shadow:0 10px 30px rgba(91,103,220,.22);

}

.quick{

display:flex;

gap:8px;

overflow-x:auto;

padding:0 2px 15px;

scrollbar-width:none;

}

.quick::-webkit-scrollbar{
display:none;
}

.quick button{

flex-shrink:0;

padding:10px 14px;

border-radius:15px;

border:1px solid rgba(255,255,255,.1);

background:rgba(255,255,255,.055);

color:#cdd7ee;

font-family:inherit;

font-size:11px;

cursor:pointer;

}

.input-area{

position:absolute;

bottom:0;

left:0;
right:0;

padding:13px 15px 18px;

background:
linear-gradient(
to top,
rgba(7,13,27,1) 65%,
rgba(7,13,27,0)
);

}

.input-box{

display:flex;

align-items:flex-end;

gap:8px;

padding:8px 8px 8px 10px;

border-radius:21px;

background:rgba(255,255,255,.07);

border:1px solid rgba(255,255,255,.1);

backdrop-filter:blur(20px);

box-shadow:0 15px 45px rgba(0,0,0,.25);

}

textarea{

flex:1;

resize:none;

border:none;

outline:none;

background:transparent;

color:white;

font-family:inherit;

font-size:13px;

line-height:1.8;

max-height:100px;

padding:7px 6px;

}

textarea::placeholder{
color:#71809b;
}

.send{

width:43px;

height:43px;

border:none;

border-radius:15px;

background:
linear-gradient(
135deg,
#7185ff,
#906fe8
);

color:white;

font-size:18px;

cursor:pointer;

}

.send:disabled{

opacity:.5;

cursor:not-allowed;

}

@keyframes fadeUp{

from{

opacity:0;

transform:translateY(12px);

}

to{

opacity:1;

transform:translateY(0);

}

}

</style>

</head>

<body>

<a href="index.html" class="home-back">

<span class="icon">⌂</span>

<b>بازگشت به خانه</b>

</a>

<div class="background">

<div class="star"></div>
<div class="star"></div>
<div class="star"></div>
<div class="star"></div>
<div class="star"></div>
<div class="star"></div>
<div class="star"></div>

</div>

<div class="app">

<header class="header">

<div class="moon">
🌙
</div>

<div class="header-text">

<h1>
AmirCalm
</h1>

<div class="status">

<span class="online"></span>

اینجا برای شنیدن تو هستم

</div>

</div>

</header>

<main class="messages" id="messages">

<section class="welcome">

<div class="welcome-icon">
🤍
</div>

<h2>
لازم نیست وانمود کنی حالت خوب است.
</h2>

<p>
اینجا می‌توانی همان‌طور که هستی حرف بزنی.
عجله‌ای نیست؛ من گوش می‌دهم.
</p>

</section>

<div class="message ai">

<div class="bubble">

سلام 🤍
<br>

خوش آمدی به AmirCalm.

<br>

اگر چیزی ذهنت را مشغول کرده،
از همان‌جا شروع کن.

</div>

</div>

<div class="quick">

<button onclick="quickMessage('می‌خواهم حرف بزنم')">
💬 می‌خواهم حرف بزنم
</button>

<button onclick="quickMessage('آرامم کن')">
🫂 آرامم کن
</button>

<button onclick="quickMessage('ذهنم شلوغ است')">
🧠 ذهنم شلوغ است
</button>

<button onclick="quickMessage('فقط گوش بده')">
🌙 فقط گوش بده
</button>

</div>

</main>

<div class="input-area">

<div class="input-box">

<textarea
id="input"
rows="1"
placeholder="هر چیزی که دلت می‌خواهد بگو..."
></textarea>

<button
class="send"
id="sendButton"
onclick="sendMessage()"
>

↑

</button>

</div>

</div>

</div>

<script>

const input =
document.getElementById("input");

const messages =
document.getElementById("messages");

const sendButton =
document.getElementById("sendButton");

const API_URL =
"https://amircalm-server.onrender.com/api/chat";

let sending = false;

function addMessage(text,type){

const message =
document.createElement("div");

message.className =
"message " + type;

const bubble =
document.createElement("div");

bubble.className =
"bubble";

bubble.textContent =
text;

message.appendChild(bubble);

messages.appendChild(message);

messages.scrollTop =
messages.scrollHeight;

return message;

}

function addLoadingMessage(){

return addMessage(
"در حال گوش دادن... 🤍",
"ai"
);

}

async function sendMessage(){

const text =
input.value.trim();

if(!text || sending)
return;

sending = true;

sendButton.disabled = true;

addMessage(
text,
"user"
);

input.value = "";

const loading =
addLoadingMessage();

try{

const response =
await fetch(API_URL,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
message:text
})

});

const data =
await response.json();

loading.remove();

if(!response.ok){

throw new Error(
data.error ||
"Server error"
);

}

if(
data.reply &&
typeof data.reply === "string"
){

addMessage(
data.reply,
"ai"
);

}else{

addMessage(
"پاسخی دریافت نشد. 🤍",
"ai"
);

}

}catch(error){

console.error(error);

loading.remove();

addMessage(
"ارتباط با همراه AmirCalm برقرار نشد. 🤍",
"ai"
);

}finally{

sending = false;

sendButton.disabled = false;

input.focus();

}

}

function quickMessage(text){

if(sending)
return;

input.value =
text;

sendMessage();

}

input.addEventListener(
"keydown",
function(e){

if(
e.key === "Enter" &&
!e.shiftKey
){

e.preventDefault();

sendMessage();

}

});

</script>

</body>

</html>
