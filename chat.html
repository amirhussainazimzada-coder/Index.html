<script>
const input = document.getElementById("input");
const messages = document.getElementById("messages");
const sendButton = document.getElementById("sendButton");

const API_URL = "https://amircalm-server.onrender.com/api/chat";

let sending = false;

function addMessage(text, type){

  const message = document.createElement("div");
  message.className = "message " + type;

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  bubble.textContent = text;

  message.appendChild(bubble);
  messages.appendChild(message);

  messages.scrollTop = messages.scrollHeight;

  return message;
}

function addLoadingMessage(){

  const message = document.createElement("div");
  message.className = "message ai";
  message.id = "loading-message";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = "در حال گوش دادن... 🤍";

  message.appendChild(bubble);
  messages.appendChild(message);

  messages.scrollTop = messages.scrollHeight;

  return message;
}

async function sendMessage(){

  const text = input.value.trim();

  if(!text || sending) return;

  sending = true;
  sendButton.disabled = true;

  addMessage(text, "user");

  input.value = "";

  const loadingMessage = addLoadingMessage();

  try{

    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: text
      })
    });

    const data = await response.json();

    loadingMessage.remove();

    if(!response.ok){

      addMessage(
        data.error || "ارتباط با همراه آرام برقرار نشد. 🤍",
        "ai"
      );

      return;
    }

    if(typeof data.reply === "string" && data.reply.trim()){

      addMessage(data.reply.trim(), "ai");

    }else{

      addMessage(
        "فعلاً پاسخی دریافت نشد. 🤍",
        "ai"
      );

    }

  }catch(error){

    console.error("AmirCalm error:", error);

    loadingMessage.remove();

    addMessage(
      "ارتباط با AmirCalm برقرار نشد. لطفاً چند لحظه بعد دوباره تلاش کن. 🤍",
      "ai"
    );

  }finally{

    sending = false;
    sendButton.disabled = false;
    input.focus();

  }
}

function quickMessage(text){

  if(sending) return;

  input.value = text;
  sendMessage();

}

input.addEventListener("keydown", function(e){

  if(e.key === "Enter" && !e.shiftKey){

    e.preventDefault();
    sendMessage();

  }

});
</script>
